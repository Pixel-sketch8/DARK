<!-- Gaming Section with Packages and Prices -->
<h2 class="section-title">Gaming Section</h2>
<div class="grid-container">
  <div class="card">
    <img src="pubg.jpg" alt="PUBG Mobile" class="card-image">
    <h3>PUBG Mobile</h3>
    <p style="color:var(--accent-blue); font-weight:bold;">$0.99 – $99.99</p>
    <select class="card-select">
      <option value="">Select UC Pack</option>
      <option value="60">60 UC – $0.99</option>
      <option value="325">325+25 UC – $4.99</option>
      <option value="660">660+60 UC – $9.99</option>
      <option value="1800">1800+300 UC – $24.99</option>
      <option value="6000">6000+2100 UC – $99.99</option>
    </select>
    <button class="btn btn-blue card-btn">Add to Cart</button>
  </div>

  <div class="card">
    <img src="fortnite.jpg" alt="Fortnite" class="card-image">
    <h3>Fortnite</h3>
    <p style="color:var(--accent-blue); font-weight:bold;">$8.99 – $89.99</p>
    <select class="card-select">
      <option value="">Select V-Bucks</option>
      <option value="800">800 V-Bucks – $8.99</option>
      <option value="2400">2,400 V-Bucks – $22.99</option>
      <option value="4500">4,500 V-Bucks – $36.99</option>
      <option value="12500">12,500 V-Bucks – $89.99</option>
    </select>
    <button class="btn btn-blue card-btn">Add to Cart</button>
  </div>

  <div class="card">
    <img src="roblox.jpg" alt="Roblox" class="card-image">
    <h3>Roblox</h3>
    <p style="color:var(--accent-blue); font-weight:bold;">$9.99 – $49.99</p>
    <select class="card-select">
      <option value="">Select Robux</option>
      <option value="800">800 Robux – $9.99</option>
      <option value="2000">2,000 Robux – $24.99</option>
      <option value="4500">4,500 Robux – $49.99</option>
    </select>
    <button class="btn btn-blue card-btn">Add to Cart</button>
  </div>

  <div class="card">
    <img src="xbox.jpg" alt="Xbox" class="card-image">
    <h3>Xbox</h3>
    <p style="color:var(--accent-blue); font-weight:bold;">$15.00 – $100.00</p>
    <select class="card-select">
      <option value="">Select Pass / Top-Up</option>
      <option value="15">$15 Gift Card</option>
      <option value="25">$25 Gift Card</option>
      <option value="gp">1 Month Game Pass – $16.99</option>
    </select>
    <button class="btn btn-blue card-btn">Add to Cart</button>
  </div>

  <div class="card">
    <img src="steam.jpg" alt="Steam" class="card-image">
    <h3>Steam</h3>
    <p style="color:var(--accent-blue); font-weight:bold;">$10.00 – $100.00</p>
    <select class="card-select">
      <option value="">Select Wallet Code</option>
      <option value="10">$10 Wallet Code</option>
      <option value="20">$20 Wallet Code</option>
      <option value="50">$50 Wallet Code</option>
      <option value="100">$100 Wallet Code</option>
    </select>
    <button class="btn btn-blue card-btn">Add to Cart</button>
  </div>

  <div class="card">
    <img src="others.jpg" alt="Others" class="card-image">
    <h3>Others</h3>
    <p style="color:var(--accent-blue); font-weight:bold;">Custom Amount</p>
    <select class="card-select">
      <option value="">Select Service</option>
      <option value="custom">Custom Top-Up</option>
    </select>
    <button class="btn btn-blue card-btn">View Options</button>
  </div>
</div>
