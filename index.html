<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>DARK</title>

<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  background: #050505;
  color: white;
  font-family: Arial, sans-serif;
  text-align: center;
}

header {
  padding: 25px;
  border-bottom: 1px solid #123;
}

.logo {
  font-size: 32px;
  font-weight: bold;
  letter-spacing: 6px;
  color: #00aaff;
}

.hero {
  min-height: 80vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 30px;
}

.hero-content {
  max-width: 700px;
}

h1 {
  font-size: clamp(45px, 10vw, 90px);
  margin-bottom: 20px;
}

h1 span {
  color: #00aaff;
}

p {
  color: #aaa;
  font-size: 18px;
  line-height: 1.6;
  margin-bottom: 30px;
}

button {
  background: #00aaff;
  color: white;
  border: none;
  padding: 16px 30px;
  border-radius: 8px;
  font-weight: bold;
  font-size: 16px;
  cursor: pointer;
}

button:hover {
  box-shadow: 0 0 25px #00aaff;
}

.status {
  margin-top: 30px;
  color: #00ff88;
  font-weight: bold;
}
</style>
</head>

<body>

<header>
  <div class="logo">DARK</div>
</header>

<section class="hero">

  <div class="hero-content">

    <h1>WELCOME TO <span>DARK</span></h1>

    <p>
      Gaming top-ups, digital products,
      gift cards and digital services.
    </p>

    <button onclick="alert('DARK is working!')">
      ENTER DARK
    </button>

    <div class="status">
      ● WEBSITE ONLINE
    </div>

  </div>

</section>

</body>
