<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DARK — Gaming Digital Store</title>
    <style>
        /* ==========================================================================
           1. CORE STYLES & VARIABLES
           ========================================================================== */
        :root {
            --bg-deep: #050811;
            --panel-dark: #0b111e;
            --panel-glass: rgba(11, 17, 30, 0.7);
            --neon-blue: #0088ff;
            --neon-blue-glow: rgba(0, 136, 255, 0.4);
            --accent-green: #00ff88;
            --accent-green-glow: rgba(0, 255, 136, 0.2);
            --text-main: #ffffff;
            --text-muted: #718096;
            --border-color: #1a2638;
            --pubg-color: #ff9900;
            --ff-color: #ff3300;
            --cod-color: #b39256;
            --roblox-color: #ff3344;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            scroll-behavior: smooth;
        }

        body {
            background-color: var(--bg-deep);
            color: var(--text-main);
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            overflow-x: hidden;
            min-height: 100vh;
            line-height: 1.5;
        }

        /* Ambient Animated Background Smoke Effect */
        .ambient-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            pointer-events: none;
            background: 
                radial-gradient(circle at 20% 30%, rgba(0, 136, 255, 0.15) 0%, transparent 50%),
                radial-gradient(circle at 80% 70%, rgba(0, 255, 136, 0.08) 0%, transparent 50%);
            opacity: 0.8;
            animation: smokeMove 20s infinite alternate ease-in-out;
        }

        @keyframes smokeMove {
            0% { transform: scale(1) translate(0px, 0px); }
            100% { transform: scale(1.1) translate(20px, -20px); }
        }

        /* ==========================================================================
           2. HEADER & NAVIGATION
           ========================================================================== */
        header {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            z-index: 100;
            background: rgba(5, 8, 17, 0.85);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border-color);
            padding: 15px 5%;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo-area {
            font-size: 26px;
            font-weight: 900;
            letter-spacing: 4px;
            text-transform: uppercase;
            color: var(--text-main);
            display: flex;
            align-items: center;
            gap: 10px;
            text-shadow: 0 0 10px var(--neon-blue-glow);
        }

        .logo-area span {
            color: var(--neon-blue);
        }

        .nav-container {
            display: flex;
            align-items: center;
            gap: 30px;
        }

        nav {
            display: flex;
            gap: 24px;
        }

        nav a {
            color: var(--text-muted);
            text-decoration: none;
            font-size: 13px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: color 0.3s;
        }

        nav a:hover, nav a.active {
            color: var(--text-main);
            text-shadow: 0 0 8px rgba(255,255,255,0.5);
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .action-btn {
            background: transparent;
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 8px 14px;
            border-radius: 6px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: 600;
            font-size: 13px;
            transition: all 0.3s;
        }

        .action-btn:hover {
            border-color: var(--neon-blue);
            box-shadow: 0 0 10px var(--neon-blue-glow);
        }

        .cart-count {
            background: var(--neon-blue);
            color: white;
            border-radius: 50%;
            padding: 2px 7px;
            font-size: 11px;
            font-weight: bold;
        }

        .menu-toggle {
            display: none;
            flex-direction: column;
            gap: 5px;
            background: transparent;
            border: none;
            cursor: pointer;
        }

        .menu-toggle span {
            width: 25px;
            height: 3px;
            background: var(--text-main);
            border-radius: 2px;
            transition: 0.3s;
        }

        /* ==========================================================================
           3. HERO SECTION
           ========================================================================== */
        .hero {
            padding: 160px 5% 100px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            min-height: 85vh;
            background: radial-gradient(circle at center, rgba(13, 32, 64, 0.4) 0%, transparent 65%);
            position: relative;
        }

        .hero::before {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 150px;
            background: linear-gradient(to top, var(--bg-deep), transparent);
        }

        .hero-badge {
            border: 1px solid var(--neon-blue);
            color: var(--neon-blue);
            background: rgba(0, 136, 255, 0.05);
            padding: 6px 20px;
            border-radius: 20px;
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 3px;
            margin-bottom: 25px;
            font-weight: bold;
            box-shadow: 0 0 15px rgba(0, 136, 255, 0.1);
            animation: pulseGlow 3s infinite alternate;
        }

        @keyframes pulseGlow {
            0% { box-shadow: 0 0 10px rgba(0, 136, 255, 0.1); }
            100% { box-shadow: 0 0 20px rgba(0, 136, 255, 0.3); border-color: #33a3ff; }
        }

        .hero h1 {
            font-size: 64px;
            font-weight: 900;
            line-height: 1.1;
            margin-bottom: 20px;
            letter-spacing: 3px;
            text-transform: uppercase;
        }

        .hero h1 span {
            color: var(--neon-blue);
            text-shadow: 0 0 20px var(--neon-blue-glow);
        }

        .hero p {
            color: var(--text-muted);
            font-size: 16px;
            max-width: 600px;
            line-height: 1.7;
            margin-bottom: 40px;
        }

        .hero-buttons {
            display: flex;
            gap: 20px;
            z-index: 5;
        }

        .btn {
            padding: 14px 35px;
            font-weight: 700;
            font-size: 13px;
            border-radius: 4px;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: all 0.3s ease;
            text-decoration: none;
            display: inline-block;
        }

        .btn-glow {
            background-color: var(--neon-blue);
            color: white;
            border: none;
            box-shadow: 0 4px 20px var(--neon-blue-glow);
        }

        .btn-glow:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 25px rgba(0, 136, 255, 0.6);
            background-color: #1a94ff;
        }

        .btn-outline {
            background: transparent;
            color: white;
            border: 1px solid var(--border-color);
        }

        .btn-outline:hover {
            border-color: white;
            background: rgba(255,255,255,0.02);
            transform: translateY(-2px);
        }

        /* Search Section UI Element */
        .search-section-bar {
            width: 100%;
            max-width: 480px;
            margin: 40px auto 0;
            position: relative;
            z-index: 10;
        }

        .search-section-bar input {
            width: 100%;
            background: var(--panel-dark);
            border: 1px solid var(--border-color);
            padding: 14px 20px 14px 45px;
            border-radius: 30px;
            color: white;
            font-size: 14px;
            outline: none;
            transition: all 0.3s;
        }

        .search-section-bar input:focus {
            border-color: var(--neon-blue);
            box-shadow: 0 0 15px var(--neon-blue-glow);
        }

        .search-section-bar::before {
            content: '🔍';
            position: absolute;
            left: 18px;
            top: 13px;
            font-size: 14px;
            opacity: 0.6;
        }

        /* ==========================================================================
           4. LAYOUT CONTAINERS & MODULES
           ========================================================================== */
        section {
            padding: 80px 5%;
            max-width: 1400px;
            margin: 0 auto;
        }

        .section-header {
            text-align: center;
            margin-bottom: 50px;
        }

        .section-header h2 {
            font-size: 36px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 2px;
