<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DARK — Gaming Digital Store</title>
    <style>
        /* --- VISUAL STYLING AND THEME --- */
        :root {
            --bg-deep: #05070c;
            --bg-panel: rgba(14, 20, 35, 0.75);
            --border-glow: rgba(0, 140, 255, 0.4);
            --neon-blue: #008cff;
            --neon-glow: 0 0 20px rgba(0, 140, 255, 0.6);
            --accent-green: #00ffaa;
            --text-main: #ffffff;
            --text-muted: #788599;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            scroll-behavior: smooth;
        }

        body {
            background-color: var(--bg-deep);
            color: var(--text-main);
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            overflow-x: hidden;
            position: relative;
        }

        /* Ambient Background Glowing Atmosphere */
        body::before {
            content: '';
            position: fixed;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: 
                radial-gradient(circle at 30% 30%, rgba(0, 140, 255, 0.08) 0%, transparent 40%),
                radial-gradient(circle at 70% 60%, rgba(0, 255, 170, 0.04) 0%, transparent 40%);
            z-index: -1;
        }

        /* --- STICKY STABLE HEADER --- */
        header {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            z-index: 100;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 5%;
            background: rgba(5, 7, 12, 0.95);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        .logo-area {
            font-size: 26px;
            font-weight: 900;
            letter-spacing: 4px;
            text-transform: uppercase;
            color: #fff;
        }

        .logo-area span {
            color: var(--neon-blue);
        }

        nav {
            display: flex;
            gap: 25px;
        }

        nav a {
            color: var(--text-muted);
            text-decoration: none;
            font-size: 13px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            transition: color 0.3s;
        }

        nav a:hover, nav a.active {
            color: var(--text-main);
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .action-icon-btn {
            background: transparent;
            border: none;
            color: #fff;
            font-size: 20px;
            cursor: pointer;
            position: relative;
        }

        #cart-badge-count {
            position: absolute;
            top: -8px;
            right: -10px;
            background: var(--neon-blue);
            font-size: 10px;
            font-weight: bold;
            padding: 2px 6px;
            border-radius: 10px;
        }

        /* --- HERO VIEWPORT SECTION --- */
        .hero-viewport {
            min-height: 85vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 140px 20px 60px 20px;
            background: radial-gradient(circle at center, rgba(13, 28, 56, 0.4) 0%, transparent 70%);
        }

        .hero-badge {
            border: 1px solid var(--neon-blue);
            color: var(--neon-blue);
            box-shadow: var(--neon-glow);
            padding: 6px 20px;
            border-radius: 30px;
            font-size: 11px;
            font-weight: 800;
            letter-spacing: 3px;
            text-transform: uppercase;
            margin-bottom: 25px;
            background: rgba(0, 140, 255, 0.05);
        }

        .hero-viewport h1 {
            font-size: clamp(38px, 6vw, 64px);
            font-weight: 900;
            line-height: 1.1;
            letter-spacing: 2px;
            margin-bottom: 20px;
        }

        .hero-viewport h1 span {
            color: var(--neon-blue);
            text-shadow: var(--neon-glow);
        }

        .hero-viewport p {
            color: var(--text-muted);
            font-size: 16px;
            max-width: 600px;
            line-height: 1.6;
            margin-bottom: 40px;
        }

        .hero-buttons-container {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .btn {
            padding: 14px 35px;
            font-size: 13px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 2px;
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.3s;
            text-decoration: none;
            display: inline-block;
        }

        .btn-fill-neon {
            background-color: var(--neon-blue);
            color: #fff;
            border: none;
            box-shadow: var(--neon-glow);
        }

        .btn-fill-neon:hover {
            transform: translateY(-2px);
            box-shadow: 0 0 30px rgba(0, 140, 255, 0.9);
        }

        .btn-outline-muted {
            background: transparent;
            color: #fff;
            border: 1px solid #233044;
        }

        .btn-outline-muted:hover {
            border-color: #fff;
        }

        /* --- STABLE SEARCH ENGINE MENU BAR --- */
        .search-container-bar {
            max-width: 500px;
            margin: 20px auto 40px auto;
            padding: 0 20px;
        }

        .search-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .search-wrapper input {
            width: 100%;
            padding: 14px 20px 14px 45px;
            background: rgba(14, 20, 35, 0.8);
            border: 1px solid var(--border-glow);
            border-radius: 30px;
            color: #fff;
            outline: none;
            font-size: 14px;
        }

        .search-wrapper input:focus {
            border-color: var(--neon-blue);
            box-shadow: var(--neon-glow);
        }

        .search-wrapper span {
            position: absolute;
            left: 18px;
            color: var(--text-muted);
        }

        /* --- CONTAINER SECTIONS --- */
        section {
            padding: 60px 5% 40px 5%;
            max-width: 1400px;
            margin: 0 auto;
        }

        .section-header-block {
            text-align: center;
            margin-bottom: 50px;
        }

        .section-header-block h2 {
            font-size: 32px;
            font-weight: 800;
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-bottom: 10px;
        }

        .section-header-block p {
            color: var(--text-muted);
            font-size: 14px;
        }

        .categories-grid-layout {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 25px;
        }

        .category-showcase-card {
            background: var(--bg-panel);
            border: 1px solid rgba(255, 255, 255, 0.04);
            border-radius: 8px;
            padding: 35px 25px;
            text-align: center;
            backdrop-filter: blur(10px);
            transition: all 0.3s ease;
        }

        .category-showcase-card:hover {
            transform: translateY(-5px);
            border-color: var(--border-glow);
            box-shadow: var(--neon-glow);
        }

        .game-avatar-fallback {
            width: 70px;
            height: 70px;
            margin: 0 auto 20px auto;
            background: #141b2d;
            border: 2px solid var(--border-glow);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
        }

        .category-showcase-card h3 {
            font-size: 18px;
            letter-spacing: 1px;
            margin-bottom: 10px;
            text-transform: uppercase;
        }

        .category-showcase-card p {
            color: var(--text-muted);
            font-size: 13px;
            margin-bottom: 25px;
        }

        .category-showcase-card .btn-card {
            background: transparent;
            border: 1px solid var(--neon-blue);
            color: var(--neon-blue);
            padding: 8px 20px;
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            border-radius: 4px;
            text-decoration: none;
            display: inline-block;
        }

        /* --- THE PRODUCT MARKETPLACE CATALOGS --- */
        .game-catalog-group {
            margin-top: 40px;
            margin-bottom: 60px;
        }

        .catalog-title-border {
            display: flex;
            align-items: center;
            gap: 20px;
            margin-bottom: 30px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            padding-bottom: 15px;
        }

        .catalog-title-border h3 {
            font-size: 22px;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .products-responsive-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
        }

        .product-item-card {
            background: var(--bg-panel);
            border: 1px solid rgba(255, 255, 255, 0.03);
            border-radius: 6px;
            padding: 25px 20px;
